name: V3 Historical Backtest

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/v3-historical-backtest.yml'
      - 'scripts/backtest.py'
      - 'core/scalping_v3.py'
      - 'core/technical.py'
      - 'agents/futures/agent.py'
      - 'agents/spot/agent.py'
      - 'requirements.txt'

permissions:
  contents: read

concurrency:
  group: v3-historical-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install backtest dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Run two-year V3 historical backtest
        run: |
          python scripts/backtest.py --years 2 --symbols BTCUSDT ETHUSDT --output backtest_results --cache data/backtest_cache

      - name: Upload historical results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: V3-Historical-Backtest-BTC-ETH-2Y
          path: backtest_results/
          if-no-files-found: warn
          retention-days: 30
