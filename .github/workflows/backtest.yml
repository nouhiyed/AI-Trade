name: AI-Trader Historical Backtest

on:
  workflow_dispatch:
    inputs:
      years:
        description: Historical period
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
        default: "2"

  push:
    paths:
      - 'scripts/backtest.py'
      - 'scripts/plot_backtest_trades.py'
      - '.github/workflows/backtest.yml'
permissions:
  contents: read

concurrency:
  group: ai-trader-historical-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install matplotlib

      - name: Compile backend and backtest
        run: python -m compileall -q agents core scripts

      - name: Run eight-asset two-year historical tests
        run: |
          python scripts/backtest.py \
            --years "${{ inputs.years || '2' }}" \
            --symbols BTCUSDT ETHUSDT BNBUSDT SOLUSDT XRPUSDT ADAUSDT DOGEUSDT LINKUSDT \
            --output backtest_results

      - name: Render one chart for every completed trade
        run: |
          python scripts/plot_backtest_trades.py \
            --trades backtest_results/trades.csv \
            --cache data/backtest_cache \
            --output backtest_results/trade_charts \
            --years "${{ inputs.years || '2' }}"

      - name: Upload historical report and trade charts
        uses: actions/upload-artifact@v4
        with:
          name: AI-Trader-Backtest-${{ inputs.years || '2' }}-year
          path: |
            backtest_results/summary.json
            backtest_results/trades.csv
            backtest_results/trade_charts/*.png
          if-no-files-found: error
