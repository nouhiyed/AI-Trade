name: AI-Trader Historical Backtest

on:
  workflow_dispatch:
    inputs:
      years:
        description: Historical period
        required: true
        type: choice
        options:
          - "1"
          - "2"
          - "3"
        default: "2"
  push:
    paths:
      - 'scripts/backtest.py'
      - 'scripts/plot_backtest_trades.py'
      - '.github/workflows/backtest.yml'

permissions:
  contents: read

concurrency:
  group: ai-trader-historical-backtest
  cancel-in-progress: true

jobs:
  backtest:
    name: Backtest \${{ matrix.symbol }} (Futures + Spot)
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        symbol:
          - BTCUSDT
          - ETHUSDT
          - BNBUSDT
          - SOLUSDT
          - XRPUSDT
          - ADAUSDT
          - DOGEUSDT
          - LINKUSDT
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install matplotlib

      - name: Compile backend and backtest
        run: python -m compileall -q agents core scripts

      - name: Run this coin in Futures and Spot and save checkpoints
        run: |
          python scripts/backtest.py \
            --years "\${{ inputs.years || '2' }}" \
            --symbols "\${{ matrix.symbol }}" \
            --output "backtest_results/\${{ matrix.symbol }}"

      - name: Render charts for this coin's completed trades
        if: always() && hashFiles('backtest_results/\${{ matrix.symbol }}/trades.csv') != ''
        run: |
          python scripts/plot_backtest_trades.py \
            --trades "backtest_results/\${{ matrix.symbol }}/trades.csv" \
            --cache data/backtest_cache \
            --output "backtest_results/\${{ matrix.symbol }}/trade_charts" \
            --years "\${{ inputs.years || '2' }}"

      - name: Upload this coin's independent report and charts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Trader-Backtest-\${{ matrix.symbol }}-\${{ inputs.years || '2' }}-year
          path: backtest_results/\${{ matrix.symbol }}/
          if-no-files-found: warn
          retention-days: 30
