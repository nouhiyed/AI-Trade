name: AI-Trader Adaptive Trend Research Backtest

on:
  workflow_dispatch:
    inputs:
      years:
        description: Historical period
        required: true
        type: choice
        options: ["1", "2", "3"]
        default: "2"
  push:
    branches:
      - "research/adaptive-trend-v2-regime"
    paths:
      - "core/adaptive_trend.py"
      - "core/market_regime.py"
      - "core/backtest_costs.py"
      - "core/scalping_strategies.py"
      - "core/scalping_v2.py"
      - "core/scalping_v3.py"
      - "scripts/backtest.py"
      - "scripts/backtest_adaptive.py"
      - "scripts/backtest_scalping.py"
      - "tests/test_adaptive_trend.py"
      - "tests/test_backtest_costs.py"
      - "tests/test_scalping_strategies.py"
      - "tests/test_scalping_v2.py"
      - "tests/test_scalping_v3.py"
      - ".github/workflows/adaptive-backtest.yml"

permissions:
  contents: read

concurrency:
  group: ai-trader-scalping-v2-research
  cancel-in-progress: false

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pillow matplotlib
      - name: Compile and run all unit tests
        run: |
          python -m compileall -q agents api core scripts tests
          python -m pytest -q tests

  backtest:
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        symbol:
          - BTCUSDT
          - ETHUSDT
          - BNBUSDT
          - SOLUSDT
          - XRPUSDT
          - ADAUSDT
          - DOGEUSDT
          - LINKUSDT
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pillow matplotlib
      - name: Run existing baseline on the same symbol and date window
        run: |
          python scripts/backtest.py \
            --years "${{ inputs.years || '2' }}" \
            --symbols "${{ matrix.symbol }}" \
            --output "baseline_results"
      - name: Run Adaptive Trend v2 on the same cached market data
        run: |
          python scripts/backtest_adaptive.py \
            --years "${{ inputs.years || '2' }}" \
            --symbols "${{ matrix.symbol }}" \
            --output "adaptive_backtest_results"
      - name: Run repaired v1 scalper baseline with fill-anchored levels
        run: |
          python scripts/backtest_scalping.py \
            --years "${{ inputs.years || '2' }}" \
            --symbols "${{ matrix.symbol }}" \
            --strategy-version v1 \
            --output "scalping_v1_fixed" \
            --cache "data/backtest_cache"
      - name: Run new Futures and Spot Scalping v2
        run: |
          python scripts/backtest_scalping.py \
            --years "${{ inputs.years || '2' }}" \
            --symbols "${{ matrix.symbol }}" \
            --strategy-version v2 \
            --output "scalping_v2" \
            --cache "data/backtest_cache"
      - name: Run higher-frequency Futures and Spot Scalping v3
        run: |
          python scripts/backtest_scalping.py \
            --years "${{ inputs.years || '2' }}" \
            --symbols "${{ matrix.symbol }}" \
            --strategy-version v3 \
            --output "scalping_v3" \
            --cache "data/backtest_cache"
      - name: Compare v2 against higher-frequency v3
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          symbol = "${{ matrix.symbol }}"
          rows = []
          for market in ("futures", "spot"):
              old = json.loads(Path(f"scalping_v2/{symbol}/{market}_summary.json").read_text())
              new = json.loads(Path(f"scalping_v3/{symbol}/{market}_summary.json").read_text())
              keys = ("trades", "trades_per_30_days", "net_pnl", "net_return_pct", "profit_factor", "max_drawdown_pct", "win_rate_pct", "average_holding_minutes", "total_fees")
              rows.append({"market": market, "v2": {k: old.get(k) for k in keys}, "v3": {k: new.get(k) for k in keys}})
          out = Path(f"scalping_v3/{symbol}/v2_vs_v3.json")
          out.write_text(json.dumps({"symbol": symbol, "comparison": rows, "trade_rate_target_per_hour": {"futures": 4, "spot": 2}, "target_scope": "aggregate across eight symbols; not forced"}, indent=2), encoding="utf-8")
          print(out.read_text())
          PY
      - name: Compare repaired v1 against v2
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          symbol = "${{ matrix.symbol }}"
          rows = []
          for market in ("futures", "spot"):
              old = json.loads(Path(f"scalping_v1_fixed/{symbol}/{market}_summary.json").read_text())
              new = json.loads(Path(f"scalping_v2/{symbol}/{market}_summary.json").read_text())
              rows.append({
                  "market": market,
                  "repaired_v1": {k: old.get(k) for k in ("trades", "trades_per_30_days", "net_pnl", "net_return_pct", "profit_factor", "max_drawdown_pct", "win_rate_pct", "total_fees")},
                  "v2": {k: new.get(k) for k in ("trades", "trades_per_30_days", "net_pnl", "net_return_pct", "profit_factor", "max_drawdown_pct", "win_rate_pct", "total_fees")},
                  "net_pnl_change": round(float(new.get("net_pnl", 0)) - float(old.get("net_pnl", 0)), 4),
              })
          result = {"symbol": symbol, "comparison": rows, "note": "Both use the same 1m execution, fill-anchored SL/TP, cost model, risk and historical window."}
          out = Path(f"scalping_v2/{symbol}/v1_vs_v2.json")
          out.write_text(json.dumps(result, indent=2), encoding="utf-8")
          print(out.read_text())
          PY
      - name: Compare baseline and Adaptive Trend per market
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          symbol = "${{ matrix.symbol }}"
          result = {"symbol": symbol, "comparison_basis": "same workflow run, same requested years, same Binance monthly archives, matched 0.25% risk, same dynamic cost and exit engines"}
          rows = []
          for market in ("futures", "spot"):
              old = json.loads(Path(f"baseline_results/{symbol}/{market}_summary.json").read_text())
              new = json.loads(Path(f"adaptive_backtest_results/{symbol}/{market}_summary.json").read_text())
              rows.append({
                  "market": market,
                  "baseline": {k: old.get(k) for k in ("start", "end", "trades", "net_pnl", "net_return_pct", "profit_factor", "max_drawdown_pct", "win_rate_pct")},
                  "adaptive": {k: new.get(k) for k in ("start", "end", "trades", "net_pnl", "net_return_pct", "profit_factor", "max_drawdown_pct", "win_rate_pct")},
                  "net_pnl_change": round(float(new.get("net_pnl", 0)) - float(old.get("net_pnl", 0)), 4),
              })
          result["markets"] = rows
          result["warning"] = "Futures and Spot are independent per-market backtests, not one shared portfolio."
          out = Path(f"adaptive_backtest_results/{symbol}/comparison.json")
          out.write_text(json.dumps(result, indent=2), encoding="utf-8")
          print(out.read_text())
          PY
      - name: Render baseline trade charts with cost breakdown
        if: always() && hashFiles('baseline_results/${{ matrix.symbol }}/trades.csv') != ''
        run: |
          python scripts/plot_backtest_trades.py \
            --trades "baseline_results/${{ matrix.symbol }}/trades.csv" \
            --cache "data/backtest_cache" \
            --output "baseline_results/${{ matrix.symbol }}/trade_charts" \
            --years "${{ inputs.years || '2' }}"
      - name: Render Adaptive Trend v2 trade charts with cost breakdown
        if: always() && hashFiles('adaptive_backtest_results/trades.csv') != ''
        run: |
          python scripts/plot_backtest_trades.py \
            --trades "adaptive_backtest_results/trades.csv" \
            --cache "data/backtest_cache" \
            --output "adaptive_backtest_results/trade_charts" \
            --years "${{ inputs.years || '2' }}"
      - name: Upload baseline, adaptive, scalping reports and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AI-Trader-Adaptive-Comparison-${{ matrix.symbol }}-${{ inputs.years || '2' }}-year
          path: |
            baseline_results/${{ matrix.symbol }}/
            adaptive_backtest_results/
            scalping_v1_fixed/
            scalping_v2/
            scalping_v3/
          if-no-files-found: warn
          retention-days: 30

  aggregate-v3-rate:
    needs: backtest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: AI-Trader-Adaptive-Comparison-*-2-year
          path: research_artifacts
          merge-multiple: true
      - name: Aggregate v3 trade frequency across the eight-symbol basket
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from datetime import datetime
          root = Path("research_artifacts")
          result = {}
          for market, target in (("futures", 4), ("spot", 2)):
              files = sorted(root.glob(f"scalping_v3/*/{market}_summary.json"))
              rows = [json.loads(p.read_text()) for p in files]
              if not rows:
                  raise SystemExit(f"No v3 {market} summaries found")
              starts = [datetime.fromisoformat(x["start"].replace("Z", "+00:00")) for x in rows]
              ends = [datetime.fromisoformat(x["end"].replace("Z", "+00:00")) for x in rows]
              hours = (max(ends)-min(starts)).total_seconds()/3600
              trades = sum(int(x.get("trades", 0)) for x in rows)
              rate = trades/hours if hours > 0 else 0
              result[market] = {"symbols_tested": len(rows), "trades": trades,
                                "period_hours": round(hours, 2), "trades_per_hour": round(rate, 3),
                                "minimum_target_per_hour": target, "target_met": rate >= target}
          Path("v3_aggregate_trade_rate.json").write_text(json.dumps(result, indent=2))
          print(json.dumps(result, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: scalping-v3-aggregate-trade-rate
          path: v3_aggregate_trade_rate.json
          retention-days: 30

# The research branch runs all unit tests, legacy comparisons, and the new scalping tests.
