name: AI-Trader Backend Tests

on:
  workflow_dispatch:
  push:
    paths:
      - 'api/**'
      - 'agents/**'
      - 'core/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'api/**'
      - 'agents/**'
      - 'core/**'
      - 'scripts/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/backend-tests.yml'

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q agents api core scripts tests
      - name: Run complete backend test suite
        run: python -m unittest discover -s tests -t . -v
