name: Build AI Trade APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - 'api/**'
      - 'core/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest Pillow

      - name: Run Python tests
        run: python -m unittest discover -s tests -t . -v

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: mobile
        run: flutter create --platforms=android --project-name ai_trade .

      - name: Configure Android network access
        working-directory: mobile
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if permission not in s:
              s = s.replace("<application", permission + "\n    <application", 1)

          match = re.search(r'<application\b[^>]*', s)
          if not match:
              raise SystemExit("ERROR: application tag not found")

          tag = match.group(0)
          if "android:usesCleartextTraffic=" not in tag:
              s = s[:match.end()] + ' android:usesCleartextTraffic="true"' + s[match.end():]

          p.write_text(s)
          print("Android network permissions configured")
          PYTHON

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build APK with retries
        working-directory: mobile
        run: |
          for attempt in 1 2 3; do
            echo "APK build attempt $attempt of 3"
            if flutter build apk --release; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; waiting 20 seconds before retry..."
              sleep 20
            fi
          done

          echo "ERROR: APK build failed after 3 attempts"
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Trade-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
