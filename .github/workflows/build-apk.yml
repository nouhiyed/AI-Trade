name: Build AI Trade APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'mobile/**'
      - 'api/**'
      - 'core/**'
      - 'agents/**'
      - 'tests/**'
      - 'requirements*.txt'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest Pillow

      - name: Run Python tests
        run: python -m unittest discover -s tests -t . -v

  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        working-directory: mobile
        run: flutter create --platforms=android --project-name ai_trade .

      - name: Install persistent Android background service
        working-directory: mobile
        run: |
          mkdir -p android/app/src/main/kotlin/com/example/ai_trade
          cp android_templates/MainActivity.kt android/app/src/main/kotlin/com/example/ai_trade/MainActivity.kt
          cp android_templates/TradingKeepAliveService.kt android/app/src/main/kotlin/com/example/ai_trade/TradingKeepAliveService.kt

      - name: Configure Gradle distribution download
        working-directory: mobile
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          p = Path("android/gradle/wrapper/gradle-wrapper.properties")
          s = p.read_text()
          url = r"distributionUrl=https\://mirror.nju.edu.cn/gradle/gradle-9.3.1-bin.zip"
          s, count = re.subn(r"(?m)^distributionUrl=.*$", url, s)
          if count != 1:
              raise SystemExit("ERROR: Expected one Gradle distributionUrl")
          checksum = "distributionSha256Sum=b266d5ff6b90eada6dc3b20cb090e3731302e553a27c5d3e4df1f0d76beaff06"
          if re.search(r"(?m)^distributionSha256Sum=", s):
              s = re.sub(r"(?m)^distributionSha256Sum=.*$", checksum, s)
          else:
              s = s.rstrip() + "\n" + checksum + "\n"
          p.write_text(s)
          print("Gradle 9.3.1 BIN download configured")
          PYTHON

      - name: Configure Android network access
        working-directory: mobile
        run: |
          python3 - <<'PYTHON'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              '<uses-permission android:name="android.permission.INTERNET" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />',
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.WAKE_LOCK" />',
          ]
          for permission in permissions:
              if permission not in s:
                  s = s.replace("<application", permission + "\n    <application", 1)

          match = re.search(r'<application\b[^>]*', s)
          if not match:
              raise SystemExit("ERROR: application tag not found")

          tag = match.group(0)
          if "android:usesCleartextTraffic=" not in tag:
              s = s[:match.end()] + ' android:usesCleartextTraffic="true"' + s[match.end():]

          service = """        <service
              android:name=".TradingKeepAliveService"
              android:enabled="true"
              android:exported="false"
              android:foregroundServiceType="specialUse">
              <property
                  android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                  android:value="Keeps AI-Trader market monitoring and risk monitoring active while the app is in the background" />
          </service>
          """
          if 'android:name=".TradingKeepAliveService"' not in s:
              s = s.replace("</application>", service + "    </application>", 1)

          p.write_text(s)
          print("Android network permissions configured")
          PYTHON

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Build APK with retries
        working-directory: mobile
        run: |
          for attempt in 1 2 3; do
            echo "APK build attempt $attempt of 3"
            if flutter build apk --release; then
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "Build failed; waiting 20 seconds before retry..."
              sleep 20
            fi
          done

          echo "ERROR: APK build failed after 3 attempts"
          exit 1

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AI-Trade-APK
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
